<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Construction</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 550px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* Animated Construction Icon */
        .icon-container {
            margin-bottom: 2rem;
            position: relative;
            display: inline-block;
        }

        .icon-pulse {
            width: 80px;
            height: 80px;
            background: rgba(99, 102, 241, 0.1);
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: pulse 2.5s infinite ease-in-out;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        @keyframes pulse {
            0% { transform: scale(0.98); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
            50% { transform: scale(1.04); box-shadow: 0 0 30px rgba(99, 102, 241, 0.6); }
            100% { transform: scale(0.98); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Launch Progress Bar */
        .progress-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            padding: 4px;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .progress-bar {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            height: 12px;
            border-radius: 100px;
            width: 75%; /* Adjust this percentage to show your build progress */
            position: relative;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        /* Email Subscription Form */
        .subscription-form {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .subscription-form input[type="email"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .subscription-form input::placeholder {
            color: #64748b;
        }

        .subscription-form button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .subscription-form button:hover {
            background: #4f46e5;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Background blur elements for depth */
        .glow-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-color);
            filter: blur(120px);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 1;
        }
        .orb-1 { top: -10%; left: -10%; }
        .orb-2 { bottom: -10%; right: -10%; }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .subscription-form { flex-direction: column; background: transparent; border: none; padding: 0; }
            .subscription-form input[type="email"] { background: rgba(255, 255, 255, 0.05); border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 8px;}
            .subscription-form button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container">
        <div class="icon-container">
            <div class="icon-pulse">🛠️</div>
        </div>
        
        <h1>Under Construction</h1>
        <p>We are busy building something amazing behind the scenes. Our new digital home will be live soon—stay tuned!</p>

        <!-- Optional Progress Bar -->
        <div>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <div class="progress-text">
                <span>Current Status: Designing & Polishing</span>
                <span>75% Complete</span>
            </div>
        </div>

        <!-- Optional Email Signup -->
        <form class="subscription-form" action="#" method="POST" style="margin-top: 2rem;">
            <input type="email" placeholder="Enter your email to get notified" required>
            <button type="submit">Notify Me</button>
        </form>
    </div>

</body>
</html>
